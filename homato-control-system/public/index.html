<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homato Control System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Homato Control System</h1>
            <div class="status-container">
                <p class="connection-status">Server: <span id="connection-indicator">Connecting...</span></p>
            </div>
        </header>
        
        <div class="device-selector">
            <h2>Select Device</h2>
            <select id="device-selector">
                <option value="">No devices available</option>
            </select>
            <div class="device-info-panel">
                <p>Device ID: <span id="current-device-id">None</span></p>
                <p>Status: <span id="device-connection-status">Unknown</span></p>
                <p>Last Seen: <span id="device-last-seen">Never</span></p>
            </div>
        </div>
        
        <div class="device-grid" id="relay-grid">
            <!-- Relay cards will be generated dynamically by JavaScript -->
        </div>
        
        <div class="log-container">
            <h3>Activity Log</h3>
            <div class="log-entries" id="log-entries">
                <!-- Log entries will be added here dynamically -->
            </div>
        </div>
    </div>
    
    <!-- Relay card template (hidden) -->
    <template id="relay-card-template">
        <div class="device-card relay-card" id="relay-card-{relayId}">
            <div class="device-icon">
                <i class="fas fa-power-off"></i>
            </div>
            <div class="device-info">
                <h2>Relay {relayNumber}</h2>
                <p>Controls {relayId}</p>
            </div>
            <div class="device-control">
                <label class="switch">
                    <input type="checkbox" id="{relayId}-control" data-relay="{relayId}">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="device-status">
                Status: <span id="{relayId}-status">Unknown</span>
            </div>
        </div>
    </template>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
